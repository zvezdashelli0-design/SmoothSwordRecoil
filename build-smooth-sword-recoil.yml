name: Build Smooth Sword Recoil

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmoothSwordRecoil-GitHub-Actions.zip'
      - '.github/workflows/build-smooth-sword-recoil.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack mod project
        run: |
          unzip -o SmoothSwordRecoil-GitHub-Actions.zip -d source
          echo "Project files:"
          find source -maxdepth 3 -type f | sort
          test -f source/SmoothSwordRecoil/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        working-directory: source/SmoothSwordRecoil
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Smooth-Sword-Recoil-Fabric-1.21.11
          path: source/SmoothSwordRecoil/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
